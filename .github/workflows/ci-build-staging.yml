# SPDX-License-Identifier: MIT
# STAGING copy of the app repo's frozen templates/ci-build.yml (the app repository
# cannot be created yet: the session token has no Administration write).
# Deliberate, visible differences from the frozen template:
#   1. working-directory points at apps/mess-bill-check (the app is nested here);
#   2. current action pins instead of the template's v4/v3 pins (setup-android@v3
#      fails on ubuntu-latest; latest is v4.0.4, published 2026-09-17);
#   3. platforms;android-36 + build-tools;36.0.0 requested explicitly (AGP 9.4.0
#      needs Build Tools 36.0.0) and then asserted, so a missing component fails
#      loudly instead of surfacing as an opaque Gradle error;
#   4. the signed-release job is NOT run: the four ANDROID_KEYSTORE_* secrets do not
#      exist yet and the frozen workflow must fail without them;
#   5. a temporary diagnostic re-emits the Gradle failure as check-run annotations,
#      because Actions logs cannot be downloaded from this sandbox.
name: Android CI (staging)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-staging-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mess-bill-check

jobs:
  test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Verify required SDK components
        run: |
          set -euo pipefail
          sdkmanager --list_installed | tee /tmp/installed.txt
          grep -q "platforms;android-36" /tmp/installed.txt
          grep -q "build-tools;36.0.0" /tmp/installed.txt

      - name: Run unit tests and build debug APK
        run: |
          # GHA's default shell is `bash -e`, which is why the previous two runs
          # produced no diagnostic annotations: the script aborted at the failing
          # pipeline before reaching them. errexit must be off for this step.
          set +e
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee /tmp/gradle.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '::error::LOG_BYTES %s TRAILING\n' "$(wc -c < /tmp/gradle.log)"
          if [ "$rc" -ne 0 ]; then
            # grep-based patterns produced nothing last run, so ship the raw log tail
            # out-of-band: base64 has no CR/LF, survives the annotation format, and is
            # reassembled locally with `gh api .../annotations`.
            tail -c 14000 /tmp/gradle.log | base64 -w0 > /tmp/log.b64
            split -b 1150 /tmp/log.b64 /tmp/chunk.
            n=0
            for f in /tmp/chunk.*; do
              n=$((n+1))
              printf '::error::B64_%02d %s\n' "$n" "$(cat "$f")"
            done
            printf '::error::B64_COUNT %s\n' "$n"
          fi
          exit "$rc"

      - name: Confirm the debug artifact exists
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -name "*.apk" -size +10k -print
