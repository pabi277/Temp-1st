# SPDX-License-Identifier: MIT
# STAGING copy of the app repo's frozen templates/ci-build.yml (the app repository
# cannot be created yet: the session token has no Administration write).
# Deliberate, visible differences from the frozen template:
#   1. working-directory points at apps/mess-bill-check (the app is nested here);
#   2. current action pins instead of the template's v4/v3 pins (setup-android@v3
#      fails on ubuntu-latest; latest is v4.0.4, published 2026-09-17);
#   3. platforms;android-36 + build-tools;36.0.0 requested explicitly (AGP 9.4.0
#      needs Build Tools 36.0.0) and then asserted, so a missing component fails
#      loudly instead of surfacing as an opaque Gradle error;
#   4. the signed-release job is NOT run: the four ANDROID_KEYSTORE_* secrets do not
#      exist yet and the frozen workflow must fail without them;
#   5. the debug APK's SHA-256 is published as a notice annotation.
name: Android CI (staging)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-staging-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mess-bill-check

jobs:
  test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Verify required SDK components
        run: |
          set -euo pipefail
          sdkmanager --list_installed | tee /tmp/installed.txt
          grep -q "platforms;android-36" /tmp/installed.txt
          grep -q "build-tools;36.0.0" /tmp/installed.txt

      - name: Run unit tests and build debug APK
        # The gradle command matches templates/ci-build.yml exactly; tee exists only so the
        # failure step below can publish the log to a sandbox that cannot download Actions logs.
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee /tmp/gradle.log

      - name: Publish installable debug APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mess-bill-check-debug-apk
          path: apps/mess-bill-check/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the build log tail when the build failed
        if: failure()
        run: |
          set +e
          printf '::error::LOG_BYTES %s\n' "$(wc -c < /tmp/gradle.log 2>/dev/null || echo 0)"
          tail -c 9000 /tmp/gradle.log 2>/dev/null | tr -d '\000-\010' | gzip -9 | base64 -w0 > /tmp/log.b64g
          fold -w850 /tmp/log.b64g | head -6 | nl -ba | while IFS=$'\t' read -r n body; do
            printf '::error::GZ%02d %s\n' "$n" "$body"
          done
          exit 0

      - name: Confirm the debug artifact exists
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -name "*.apk" -size +10k -print
          # Checksum as a notice annotation: this sandbox cannot download Actions
          # logs or artifacts, and the hash is the cheapest way to prove which APK
          # a run produced.
          sha256sum app/build/outputs/apk/debug/*.apk | awk '{ print "::notice::APK_SHA256 " $1 " (" $2 ")" }'
