# SPDX-License-Identifier: MIT
# STAGING copy of the app repo's frozen templates/ci-build.yml, because the app
# repository cannot be created yet (the session token has no Administration write).
# Deliberate, visible differences from the frozen template:
#   1. working-directory points at apps/mess-bill-check (the app is nested here);
#   2. action pins are current instead of the template's v4/v3 pins: run
#      38082608245 failed at "Set up Android SDK" because android-actions/setup-android@v3
#      no longer works on ubuntu-latest (latest is v4.0.4, published 2026-09-17);
#   3. SDK platform 36 / build-tools 36.0.0 are requested explicitly (AGP 9.4.0
#      requires Build Tools 36.0.0) and then asserted, so a missing component fails
#      loudly instead of surfacing as a confusing Gradle error;
#   4. the signed-release job is NOT run: the owner has not created the four
#      ANDROID_KEYSTORE_* secrets, and the frozen workflow must fail without them.
# The authoritative file remains apps/mess-bill-check/.github/workflows/ci-build.yml.
name: Android CI (staging)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-staging-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mess-bill-check

jobs:
  test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Verify required SDK components
        run: |
          set -euo pipefail
          sdkmanager --list_installed | tee /tmp/installed.txt
          grep -q "platforms;android-36" /tmp/installed.txt || { echo "::error::platforms;android-36 missing"; exit 1; }
          grep -q "build-tools;36.0.0" /tmp/installed.txt || { echo "::error::build-tools;36.0.0 missing"; exit 1; }
      - name: Run unit tests and build debug APK
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug > /tmp/gradle.log 2>&1
          rc=$?
          set -e
          tail -120 /tmp/gradle.log
          # This sandbox cannot download Actions logs (results-receiver host is
          # blocked), so the decisive lines are re-emitted as check-run
          # annotations, which the REST API does return. Temporary diagnostic.
          echo "::group::diagnostic annotations"
          python3 - <<'PYEOF'
import re
text = open("/tmp/gradle.log", errors="replace").read()
pat = re.compile(r"^(FAILURE:|BUILD FAILED|\* What went wrong|\* Try:|> Task|> Compilation|> Could not|e: |w: .*error|error:|Caused by:|Execution failed|Unresolved reference|.*unsupported.*Gradle.*)", re.I)
picked, seen = [], set()
for line in text.splitlines():
    line = line.strip()
    if line and pat.match(line) and line not in seen:
        seen.add(line)
        picked.append(line)
if not picked:
    picked = [l.strip() for l in text.splitlines()[-12:] if l.strip()]
def esc(value):
    return value.replace("%", "%25").replace("\r", " ").replace("\n", " ").replace("]", "")
for i, line in enumerate(picked[:22]):
    print("::error file=gradle.log,line=%d::%s" % (i + 1, esc(line)[:280]))
PYEOF
          echo "::endgroup::"
          exit $rc
      - name: Confirm the debug artifact exists
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -name "*.apk" -size +10k -print
