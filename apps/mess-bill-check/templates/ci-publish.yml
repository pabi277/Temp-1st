# SPDX-License-Identifier: MIT
# Copy to .github/workflows/ci-publish.yml only after reviewing it.
# This manual workflow builds a signed AAB and publishes to the INTERNAL track.
# Dispatch only after explicit owner authorization; green CI is not
# publish permission.
# Configure GitHub secrets (never commit values): the four ANDROID_KEYSTORE_*
# secrets used by ci-build.yml, plus PLAY_SERVICE_ACCOUNT_JSON.
# Configure the non-secret Actions variable ANDROID_PACKAGE_NAME.
# Add a protected GitHub environment named `play-internal` before use.
# Commit a Gemfile and Gemfile.lock with Fastlane pinned before production use.
name: Optional Play internal publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-internal:
    if: github.ref == 'refs/heads/main'
    environment: play-internal
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare signing key on runner
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/release-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Run tests and build signed release AAB
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest bundleRelease
      - name: Prepare Play credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo '::error::Set the protected PLAY_SERVICE_ACCOUNT_JSON Actions secret.'
            exit 1
          fi
          if [[ -z "${ANDROID_PACKAGE_NAME:-}" ]]; then
            echo '::error::Set the ANDROID_PACKAGE_NAME Actions variable.'
            exit 1
          fi
          test -s app/build/outputs/bundle/release/app-release.aab
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          chmod 600 "$RUNNER_TEMP/play-service-account.json"
      - name: Set up Ruby and locked Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Publish to internal testing track
        env:
          PLAY_JSON_KEY: ${{ runner.temp }}/play-service-account.json
        run: |
          bundle exec fastlane supply \
            --package_name "$ANDROID_PACKAGE_NAME" \
            --json_key "$PLAY_JSON_KEY" \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --track internal \
            --release_status completed \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
