# SPDX-License-Identifier: MIT
# Derived from AppFlow templates/ci-build.yml, with the action pins moved to the versions
# verified on 2026-10-11 (setup-android@v3 fails on ubuntu-latest; v4.0.4 is current). The
# template's shape is kept: test job always, signed-release job only on main and only when all
# four keystore secrets exist. Two additions, both about proving claims rather than trusting them:
# the debug APK is published as an artifact, and its badging is asserted to declare no permission.
# Assumes an Android app module named `app` and a Gradle wrapper at repo root.
# Release signing config must read ANDROID_KEYSTORE_PATH plus the four secret
# environment variables below in Gradle; fail release builds if they are absent.
# Configure these GitHub Actions secrets; never commit their values:
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Verify required SDK components
        run: |
          set -euo pipefail
          sdkmanager --list_installed | tee /tmp/installed.txt
          grep -q "platforms;android-36" /tmp/installed.txt
          grep -q "build-tools;36.0.0" /tmp/installed.txt
      - name: Run unit tests and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee /tmp/gradle.log
      - name: Publish the build log tail when the build failed
        if: failure()
        run: |
          set +e
          printf '::error::LOG_BYTES %s\n' "$(wc -c < /tmp/gradle.log 2>/dev/null || echo 0)"
          { grep -E "FAILED|AssertionError|expected:|^e: |What went wrong|Caused by" /tmp/gradle.log 2>/dev/null | head -60; tail -c 4000 /tmp/gradle.log 2>/dev/null; } | tr -d '\000-\010' | gzip -9 | base64 -w0 > /tmp/log.b64g
          fold -w850 /tmp/log.b64g | head -6 | nl -ba | while IFS=$'\t' read -r n body; do
            printf '::error::GZ%02d %s\n' "$n" "$body"
          done
          exit 0
      - name: Prove the built APK asks for nothing
        # Verifies the privacy claim against the artifact, not the source: a manifest
        # edit that adds INTERNET or an SDK would pass every unit test and still betray
        # the "no network, no login" promise, so the built APK is inspected here.
        if: success()
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$apk"
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)
          "$aapt2" dump badging "$apk" > /tmp/badging.txt
          grep -E "^package: name='com\.pabi277\.messbillcheck' versionCode='1' versionName='0\.1\.0'" /tmp/badging.txt
          grep -E "^sdkVersion:'24'" /tmp/badging.txt
          grep -E "^targetSdkVersion:'36'" /tmp/badging.txt
          grep -E "^launchable-activity: name='com\.pabi277\.messbillcheck\.ui\.TodayActivity'" /tmp/badging.txt
          if grep -q "android\.permission" /tmp/badging.txt; then
            echo "::error::the built APK declares a permission; v1 must declare none"
            grep "android\.permission" /tmp/badging.txt
            exit 1
          fi
          printf '::notice::APK_BADGING zero permissions, min24/target36, launchable=ui.TodayActivity - verified on the artifact\n'

      - name: Publish installable debug APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mess-bill-check-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Confirm the debug artifact exists
        if: success()
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -name "*.apk" -size +10k -print
          sha256sum app/build/outputs/apk/debug/*.apk | awk '{ print "::notice::APK_SHA256 " $1 " (" $2 ")" }'

  signed-release:
    name: Signed release AAB and APK
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Prepare signing key on runner
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/release-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed release AAB and APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-android-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
